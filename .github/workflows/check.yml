name: check

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq rsync
      - name: Validate portable repository
        run: ./bin/dotfiles check
