keymap:
  - name: Repeating application volume shortcuts
    exact_match: true
    remap:
      Shift-F1:
        launch: ["__HOME__/.local/bin/volume-repeat-dispatch", "focused-down"]
      Shift-F2:
        launch: ["__HOME__/.local/bin/volume-repeat-dispatch", "focused-up"]
      Shift-F9:
        launch: ["__HOME__/.local/bin/volume-repeat-dispatch", "cider-down"]
      Shift-F10:
        launch: ["__HOME__/.local/bin/volume-repeat-dispatch", "cider-up"]
